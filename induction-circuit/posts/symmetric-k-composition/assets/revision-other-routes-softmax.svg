<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">Identical C-route scores on the same sequence, different attention</title>
<desc id="desc">Two aligned copies of the visible prefix BOS A B C A B C A. The current query is the final A at position 7; correct historical successors are B at positions 2 and 5. Each position lists the C-route contribution, all remaining contributions, their total, and the resulting attention probability. C-route scores are identical in both panels: 0,1,6,1,1,6,1,1. Only the remaining contribution to BOS changes from 0 to 8. Correct attention is summed over both B positions. All scores are illustrative and are not measured 160M logits.</desc>
